<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Membrane KPI Report</title>
</head>

<body style="margin:0; padding:0; background:linear-gradient(180deg,#eef5f8 0%,#e8f3f9 100%); font-family:'Segoe UI', Arial, Helvetica, sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" border="0" style="padding:50px 0;">
<tr>
<td align="center">

<table width="720" cellpadding="0" cellspacing="0" border="0"
       style="background-color:#ffffff; border-radius:16px; overflow:hidden; box-shadow:0 6px 20px rgba(0,0,0,0.15); border-top:8px solid #0094d8;">

    <!-- Header -->
    <tr>
        <td style="padding:30px 42px; background:linear-gradient(90deg,#ffffff 0%,#f4fbff 55%,#edf8ef 100%); border-bottom:4px solid #79b943;">

            <table width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>

                    <!-- Left Logo -->
                    <td align="left" valign="middle" width="38%">
                        <img src="DS_Logo_CMYK_Small.jpg"
                             alt="Dimension Software Logo"
                             style="max-width:230px; height:auto; display:block;">
                    </td>

                    <!-- Center Title -->
                    <td align="center" valign="middle" width="24%">
                        <div style="
                            font-size:24px;
                            font-weight:700;
                            color:#0094d8;
                            line-height:1.2;
                            letter-spacing:1px;
                            text-transform:uppercase;
                            text-shadow:0 1px 1px rgba(0,0,0,0.08);">
                            Weekly<br>Report
                        </div>
                    </td>

                    <!-- Right Logo -->
                    <td align="right" valign="middle" width="38%">
                        <img src="Asset_Intellect_logo_PI_Reporting_Engine.png"
                             alt="Asset Intellect Logo"
                             style="max-width:215px; height:auto; display:block;">
                    </td>

                </tr>
            </table>

        </td>
    </tr>

    <!-- Title Band -->
    <tr>
        <td style="
            background:linear-gradient(90deg,#4d4d4d 0%,#5c5c5c 100%);
            padding:18px 42px;
            border-bottom:2px solid #0094d8;">

            <p style="
                margin:0;
                color:#ffffff;
                font-size:22px;
                font-weight:600;
                letter-spacing:0.5px;">
                Membrane KPI Report
            </p>

        </td>
    </tr>

    <!-- Body -->
    <tr>
        <td style="padding:50px 55px 42px 55px; color:#333333;">

            <p style="
                font-size:17px;
                font-weight:600;
                color:#4d4d4d;
                margin:0 0 28px 0;">
                Dear User,
            </p>

            <p style="
                font-size:16px;
                line-height:1.9;
                color:#444444;
                margin:0 0 28px 0;">

                Please find attached your 
                <strong style="color:#0094d8;">Membrane KPI Report</strong> 
                for this week.

            </p>

            <p style="
                font-size:15px;
                line-height:1.8;
                color:#666666;
                margin:0;">

                Should you have any questions or require further clarification,
                please contact the Dimension Software team.

            </p>

        </td>
    </tr>

    <!-- Accent Bar -->
    <tr>
        <td style="padding:0 55px;">
            <table width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                    <td width="45%" style="height:5px; background-color:#0094d8;"></td>
                    <td width="35%" style="height:5px; background-color:#79b943;"></td>
                    <td width="20%" style="height:5px; background-color:#9b9b9b;"></td>
                </tr>
            </table>
        </td>
    </tr>

    <!-- Footer -->
    <tr>
        <td style="
            background-color:#f8fafc;
            padding:28px 55px 32px 55px;">

            <p style="
                margin:0;
                font-size:14px;
                color:#5f5f5f;
                line-height:1.8;">

                Kind Regards,<br>

                <span style="
                    font-size:15px;
                    font-weight:700;
                    color:#0094d8;">
                    Dimension Software Ltd
                </span><br>

                <span style="color:#79b943;">
                    Asset Intellect Reporting Services
                </span>

            </p>

        </td>
    </tr>

</table>

</td>
</tr>
</table>

</body>
</html>
